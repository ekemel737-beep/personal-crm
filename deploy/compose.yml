# Production stack on the server, run by deploy.sh as `docker compose -p prod`.
# APP_IMAGE is set by deploy.sh; database credentials come from /srv/personal-crm/.env.

x-database-url: &database-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: `run --rm migrate` applies migrations and exits before the new app starts
  migrate:
    image: ${APP_IMAGE:?APP_IMAGE is set by deploy.sh}
    profiles: [migrate]
    command: ["node", "scripts/migrate.mjs"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ${APP_IMAGE:?APP_IMAGE is set by deploy.sh}
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
    # Localhost only: the outside world reaches the app through nginx
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  db-data:
